<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Django Site</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); /* Deep, rich gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif; /* Modern, elegant font */
            color: #e0e0e0; /* Light gray text for contrast */
            
            overflow: hidden; /* Prevent scrolling */
        }

        /* Subtle background animation with glowing effect */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 0, 128, 0.1), transparent 70%),
                        radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.1), transparent 70%);
            animation: backgroundGlow 20s infinite alternate;
            z-index: -1;
            will-change: transform;
        }

        @keyframes backgroundGlow {
            0% { transform: scale(1) rotate(0deg); opacity: 0.8; }
            100% { transform: scale(1.2) rotate(360deg); opacity: 1; }
        }

                .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.08); /* Very subtle transparent white */
            padding: 60px; /* Increased padding for more breathing room */
            border-radius: 20px; /* More rounded corners */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); /* Deeper shadow */
            border: 1px solid rgba(255, 255, 255, 0.15); /* More defined subtle border */
            backdrop-filter: blur(10px); /* Stronger frosted glass effect */
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out; /* Smooth transitions */
            will-change: transform, box-shadow;
            max-width: 90%; /* Limit container width */
            margin: auto; /* Center the container */
        }

        .container:hover {
            transform: translateY(-5px) scale(1.02); /* Subtle lift and scale on hover */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); /* Enhanced shadow on hover */
        }

        h1 {
            color: #00bcd4; /* Cyan-like vibrant color */
            font-size: 3vw; /* Responsive font size */
            max-font-size: 4.5em; /* Max font size */ /* Max font size */
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 188, 212, 0.6), 0 0 5px rgba(0, 188, 212, 0.8); /* Glowing text shadow */
            letter-spacing: 2px; /* Slightly increased letter spacing */
            transition: color 0.3s ease-in-out;
            will-change: color;
        }

        h1:hover {
            color: #4dd0e1; /* Lighter cyan on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="phrase-display">
            <h1>{{ frase_final }}</h1>
</body>
</html>
