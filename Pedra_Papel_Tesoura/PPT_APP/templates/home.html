<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, Papel e Tesoura</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a, #1a1a1a);
            background-size: 400% 400%;
            color: #f0f0f0; /* Light text for contrast */
            overflow: hidden;
            animation: moveGradient 15s ease infinite;
        }

        @keyframes moveGradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #e0e0e0;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            position: relative;
            z-index: 1;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: #2a2a2a;
            border-radius: 13px; /* 15px - 2px */
            z-index: -1;
        }
        h1 {
            color: #e0e0e0; /* Light heading */
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
        }
        .button {
            background-color: #4a4a4a; /* Dark button */
            color: #ffffff; /* White text on button */
            padding: 18px 35px;
            border: none;
            border-radius: 8px;
            font-size: 1.3em;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .button:hover {
            background-color: #6a6a6a; /* Lighter on hover */
        }
        .button:active {
            background-color: #3a3a3a; /* Darker on active */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Escolha sua jogada!</h1>
        <form action="{% url 'resultado' %}" method="post">
            {% csrf_token %}
            <div class="buttons">
                <button type="submit" name="jogada" value="🪨" class="button">🪨 Pedra</button>
                <button type="submit" name="jogada" value="📄" class="button">📄 Papel</button>
                <button type="submit" name="jogada" value="✂️" class="button">✂️ Tesoura</button>
            </div>
        </form>
    </div>
</body>
</html>
